[General]
network = Network
sim-time-limit = 200s
seed-set = 1

# ==============================================
# Caso 1: node[0] y node[2] transmiten a node[5]
# ==============================================
[Caso1]
Network.node[0].app.interArrivalTime = exponential(1)
Network.node[0].app.packetByteSize = 125000
Network.node[0].app.destination = 5

Network.node[2].app.interArrivalTime = exponential(1)
Network.node[2].app.packetByteSize = 125000
Network.node[2].app.destination = 5

# Desactivar node[5] explicitamente (no genera trafico)
Network.node[5].app.interArrivalTime = 0

# ==============================================
# Caso 2: todos los nodos (0,1,2,3,4,6,7) transmiten a node[5]
# Se varia interArrivalTime para encontrar el umbral de estabilidad
# ==============================================

# Configuracion base comun a todos los subcasos del Caso 2
[Caso2_Base]
# Desactivar node[5]
Network.node[5].app.interArrivalTime = 0
# Configurar destino y tamano para los nodos fuente
Network.node[0].app.packetByteSize = 125000
Network.node[0].app.destination = 5
Network.node[1].app.packetByteSize = 125000
Network.node[1].app.destination = 5
Network.node[2].app.packetByteSize = 125000
Network.node[2].app.destination = 5
Network.node[3].app.packetByteSize = 125000
Network.node[3].app.destination = 5
Network.node[4].app.packetByteSize = 125000
Network.node[4].app.destination = 5
Network.node[6].app.packetByteSize = 125000
Network.node[6].app.destination = 5
Network.node[7].app.packetByteSize = 125000
Network.node[7].app.destination = 5

[Caso2_IAT_0_5]
extends = Caso2_Base
Network.node[0].app.interArrivalTime = exponential(0.5)
Network.node[1].app.interArrivalTime = exponential(0.5)
Network.node[2].app.interArrivalTime = exponential(0.5)
Network.node[3].app.interArrivalTime = exponential(0.5)
Network.node[4].app.interArrivalTime = exponential(0.5)
Network.node[6].app.interArrivalTime = exponential(0.5)
Network.node[7].app.interArrivalTime = exponential(0.5)

